[project]
name = "gemini-chatbot"
version = "0.1.0"
description = "Terminal chatbot using Gemini gemini-3.1-flash-lite via Interactions API (single-turn, no memory)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
gemini-chatbot = "gemini_chatbot.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
